name: Budget
options:
  bundleIdPrefix: app.budgettracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Kotlin/Native framework produced by :shared:embedAndSignAppleFrameworkForXcode.
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    # -lsqlite3: the SQLDelight native driver (static framework) needs the system SQLite.
    OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3"
targets:
  Budget:
    type: application
    platform: iOS
    sources:
      - path: Budget
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          cd "$SRCROOT/.." && ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.budgettracker.ios
        PRODUCT_NAME: Budget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Budget
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  BudgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BudgetUITests
    dependencies:
      - target: Budget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.budgettracker.ios.uitests
schemes:
  Budget:
    build:
      targets:
        Budget: all
    test:
      targets:
        - BudgetUITests
